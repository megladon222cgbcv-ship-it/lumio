  --success:#3BCB93; --warning:#E8A94B; --danger:#E2596B; --info:#4EA1F3;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3,h4,.disp{font-family:'Sora',system-ui,sans-serif;}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#26263a;border-radius:8px;}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px;}
.scrollx{overflow-x:auto;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh; min-height:100dvh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; padding:20px 14px; gap:22px;
  position:sticky; top:0; height:100vh; height:100dvh;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex;align-items:center;justify-content:center;font-weight:800;font-family:Sora;font-size:14px;color:#0A0A10;flex-shrink:0;}
.brand-mark-img{width:34px;height:34px;border-radius:9px;flex-shrink:0;object-fit:cover;}
.mobile-brand-img{display:none;}
.brand-name{font-family:Sora;font-weight:700;font-size:15px;letter-spacing:.2px;}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
nav.navlist{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.navitem{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;
  color:var(--text-dim); cursor:pointer; font-size:13.5px; font-weight:500; border:1px solid transparent;
  background:none; text-align:left; width:100%;
}
.navitem svg{width:17px;height:17px;flex-shrink:0;}
.navitem:hover{background:var(--panel-2); color:var(--text);}
.navitem.active{background:var(--accent-soft); color:var(--accent-2); border-color:rgba(124,106,240,.28);}
.sidebar-foot{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
.xp-pill{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-dim);padding:0 4px;}
.streak-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warning);font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 26px; border-bottom:1px solid var(--border-soft); position:sticky; top:0;
  background:rgba(10,10,16,.82); backdrop-filter:blur(10px); z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.1px;}
.topbar .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.content{padding:22px 26px 100px; max-width:1220px; width:100%; margin:0 auto;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px; border-radius:11px; font-size:13.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--border); background:var(--panel-2); color:var(--text); transition:transform .08s ease, background .15s;
  min-height:40px;
}
.btn:active{transform:scale(.97);}
.btn:hover{background:var(--panel-b);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#0A0A10;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-danger{background:rgba(226,89,107,.14); border:1px solid rgba(226,89,107,.3); color:#F0A0AC;}
.btn-success{background:rgba(59,203,147,.16); border:1px solid rgba(59,203,147,.35); color:#7EE4BA;}
.btn-sm{padding:7px 11px;font-size:12.5px;min-height:32px;border-radius:9px;}
.btn-icon{padding:8px;min-width:38px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--r-l); padding:20px;}
.card + .card{margin-top:16px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:980px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.dash-grid{display:grid; gap:16px; grid-template-columns:2fr 1fr;}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}

.eyebrow{font-size:11px; color:var(--text-faint); font-weight:600; margin-bottom:2px;}
.stat-num{font-family:Sora; font-size:26px; font-weight:700;}
.stat-label{font-size:12px; color:var(--text-dim); margin-top:2px;}

.progress{height:9px; border-radius:99px; background:var(--panel-b); overflow:hidden; border:1px solid var(--border-soft);}
.progress > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .5s cubic-bezier(.4,0,.2,1);}
.progress.thin{height:6px;}
.progress-row{display:flex; align-items:center; gap:10px;}
.progress-row .progress{flex:1;}
.progress-row .pct{font-size:12px; color:var(--text-dim); width:34px; text-align:right; flex-shrink:0;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.2px;}
.badge-locked{background:#1c1c28;color:var(--text-faint);}
.badge-upnext{background:rgba(78,161,243,.15);color:#8FC4F5;}
.badge-active{background:rgba(124,106,240,.2);color:var(--accent-2);}
.badge-paused{background:rgba(232,169,75,.16);color:var(--warning);}
.badge-completed{background:rgba(59,203,147,.16);color:var(--success);}
.badge-skipped{background:rgba(226,89,107,.14);color:var(--danger);}
.dot{width:7px;height:7px;border-radius:99px;flex-shrink:0;}

.mission-card{border-radius:var(--r-l); padding:24px; position:relative; overflow:hidden; border:1px solid var(--border-soft);
  background:radial-gradient(120% 140% at 0% 0%, rgba(124,106,240,.13), transparent 55%), var(--panel);}
.mission-cat{font-size:11.5px; font-weight:700; letter-spacing:.4px; color:var(--accent-2);}
.mission-title{font-family:Sora; font-size:24px; font-weight:700; margin:6px 0 2px; line-height:1.25;}
.mission-sub{font-size:13.5px; color:var(--text-dim);}
.timer-display{font-family:Sora; font-size:52px; font-weight:700; letter-spacing:.5px; margin:18px 0 4px;}
.timer-meta{font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
.mission-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;}}

.tasklist{display:flex; flex-direction:column; gap:10px;}
.task-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:var(--r-m); background:var(--panel-2); border:1px solid var(--border-soft);}
.task-row.is-active{border-color:rgba(124,106,240,.4); background:var(--accent-soft);}
.task-row.is-locked{opacity:.55;}
.task-main{flex:1; min-width:0;}
.task-name{font-weight:600; font-size:14px;}
.task-meta{font-size:12px; color:var(--text-dim); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap;}
.task-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:6px;border-radius:8px;display:flex;}
.icon-btn:hover{background:var(--panel-b); color:var(--text);}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:10px; font-size:13.5px; font-family:inherit;
}
textarea{resize:vertical; min-height:70px;}
label.field{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-dim); font-weight:500;}
.field-row{display:flex; gap:10px; flex-wrap:wrap;}
.field-row > label.field{flex:1; min-width:140px;}
.check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); cursor:pointer;}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}

.modal-backdrop{position:fixed; inset:0; background:rgba(6,6,10,.65); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:680px){.modal-backdrop{align-items:center;}}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:20px 20px 0 0; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:22px;}
@media (min-width:680px){.modal{border-radius:20px;}}
.modal h3{margin:0 0 14px; font-size:17px;}
.modal-foot{display:flex; gap:10px; margin-top:18px;}
.modal-foot .btn{flex:1;}

.toast-wrap{position:fixed; bottom:90px; left:0; right:0; display:flex; justify-content:center; z-index:200; pointer-events:none;}
@media (min-width:840px){.toast-wrap{bottom:26px;}}
.toast{background:#1B1B2A; border:1px solid var(--border); color:var(--text); padding:12px 18px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; animation:toastin .25s ease;}
@keyframes toastin{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

.fab{position:fixed; right:22px; bottom:90px; z-index:40; box-shadow:0 6px 20px rgba(124,106,240,.35);}
@media (min-width:840px){.fab{bottom:26px;}}

.bottomnav{display:none;}
@media (max-width:839px){
  .sidebar{display:none;}
  .bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(13,13,20,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border-soft); padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .bottomnav button{flex:1; background:none; border:none; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; padding:5px 2px; cursor:pointer; border-radius:10px;}
  .bottomnav button svg{width:19px;height:19px;}
  .bottomnav button.active{color:var(--accent-2);}
  .content{padding:16px 14px 100px;}
  .topbar{padding:14px 16px; flex-wrap:wrap; row-gap:10px;}
  .mission-title{font-size:20px;}
  .timer-display{font-size:42px;}
  .mobile-brand-img{display:block; width:30px;height:30px;border-radius:8px;flex-shrink:0;object-fit:cover;}
}
.more-sheet-item{display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:10px; cursor:pointer; font-size:14px;}
.more-sheet-item:hover{background:var(--panel-2);}

.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); font-size:12px; color:var(--text-dim); cursor:pointer;}
.chip.on{background:var(--accent-soft); border-color:rgba(124,106,240,.4); color:var(--accent-2);}
.tabbar{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}

.empty{text-align:center; padding:36px 16px; color:var(--text-faint); font-size:13.5px;}
.empty b{color:var(--text-dim); display:block; margin-bottom:4px; font-size:14px;}

.section-title{font-size:15px; font-weight:700; margin:0 0 12px; font-family:Sora;}
hr.sep{border:none; border-top:1px solid var(--border-soft); margin:16px 0;}

table.plain{width:100%; border-collapse:collapse; font-size:13px;}
table.plain th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11.5px; padding:0 10px 8px; border-bottom:1px solid var(--border-soft);}
table.plain td{padding:10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
table.plain tr:last-child td{border-bottom:none;}

.focus-overlay{position:fixed; inset:0; background:radial-gradient(120% 120% at 50% 0%, #191930, var(--bg)); z-index:150; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.focus-exit{position:absolute; top:20px; right:20px;}
.focus-timer{font-family:Sora; font-size:min(20vw,110px); font-weight:800; letter-spacing:1px; margin:20px 0;}

.calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-cell{aspect-ratio:1/1; border-radius:10px; background:var(--panel-2); border:1px solid var(--border-soft); padding:6px; font-size:11.5px; display:flex; flex-direction:column; gap:3px; overflow:hidden;}
.cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.cal-cell.other{opacity:.35;}
.cal-dot{width:5px;height:5px;border-radius:99px;}
.weekhead{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; font-size:11px; color:var(--text-faint); text-align:center;}

.heatrow{display:flex; gap:5px;}
.heat-cell{flex:1; aspect-ratio:1; border-radius:6px; background:var(--panel-2);}

/* Onboarding / choice screen */
.onboard-overlay{position:fixed; inset:0; z-index:170; background:radial-gradient(120% 120% at 50% 0%, #191930, var(--bg)); display:flex; align-items:flex-start; justify-content:center; padding:26px 18px; overflow-y:auto;}
.onboard-card{width:100%; max-width:580px; background:var(--panel); border:1px solid var(--border); border-radius:22px; padding:28px; margin:auto; box-shadow:var(--shadow);}
.onboard-progress{display:flex; gap:5px; margin-bottom:18px;}
.onboard-progress > div{flex:1; height:4px; border-radius:99px; background:var(--panel-b);}
.onboard-progress > div.done{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.onboard-step-label{font-size:11px; color:var(--accent-2); font-weight:700; letter-spacing:.6px; margin-bottom:6px; text-transform:uppercase;}
.onboard-title{font-family:Sora; font-size:23px; font-weight:700; margin:0 0 6px;}
.onboard-sub{font-size:13px; color:var(--text-dim); margin:0 0 22px; line-height:1.5;}
.onboard-actions{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:24px;}
.onboard-brand{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-family:Sora;font-weight:800;font-size:20px;color:#0A0A10;margin-bottom:18px;}
.avatar-circle{border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:Sora; font-weight:800; color:#0A0A10; flex-shrink:0;}
.avatar-swatches{display:flex; gap:8px; flex-wrap:wrap;}
.avatar-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent; padding:0;}
.avatar-swatch.on{border-color:#fff;}
.repeat-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:10px; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:12px; padding:10px;}
.repeat-row > label{flex:1; min-width:110px;}
.suggest-chip{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:99px; background:var(--panel-2); border:1px dashed var(--border); font-size:11.5px; color:var(--text-dim); cursor:pointer;}
.gen-spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--panel-b);border-top-color:var(--accent-2);animation:spin 0.8s linear infinite;margin:0 auto 18px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.gen-spinner{animation:none;}}

/* Flashcards */
.flip-card{perspective:1200px; width:100%; max-width:420px; height:230px; margin:0 auto; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none;}}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:1px solid var(--border); background:var(--panel-2); display:flex; align-items:center; justify-content:center; padding:22px; text-align:center; font-size:16px; font-weight:600;}
.flip-face.back{transform:rotateY(180deg); color:var(--accent-2);}

@media (max-width:420px){.timer-display{font-size:36px;}}
html[data-reduced-motion="true"] *{ animation:none !important; transition:none !important; }
.chap-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);background:var(--panel-2);border:1px solid var(--border-soft);}
.chap-row .chap-name{min-width:0;overflow-wrap:anywhere;font-size:13.5px;font-weight:600;}
.chap-row select{position:static;width:auto;max-width:100%;min-height:40px;}
@media(max-width:560px){.chap-row{grid-template-columns:minmax(0,1fr) auto;}.chap-row .chap-name{grid-column:1;grid-row:1;}.chap-row .icon-btn{grid-column:2;grid-row:1;}.chap-row select{grid-column:1/-1;grid-row:2;width:100%;}}
.cloud-banner{font-size:12.5px;color:var(--warning);border:1px solid rgba(232,169,75,.35);border-radius:10px;padding:8px 10px;margin-bottom:12px;}
</style>

const uid = () => 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function fmtMinutes(m){ m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return h>0 ? `${h}h ${mm}m` : `${mm}m`; }
function fmtClock(ms){
  const totalSec = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function isWeekend(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const wd = d.getDay();
  return wd===0 || wd===6;
}
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function startOfWeek(dateStr){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()-d.getDay()); return todayStr(d); }
function monthMatrix(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const year=d.getFullYear(), month=d.getMonth();
  const startDate = new Date(year,month,1);
  startDate.setDate(startDate.getDate()-startDate.getDay());
  const cells=[];
  for(let i=0;i<42;i++){ const cd=new Date(startDate); cd.setDate(startDate.getDate()+i); cells.push({date:todayStr(cd), inMonth:cd.getMonth()===month}); }
  return cells;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= ACCOUNTS & SESSION ============================= */
// A local-only account system: no server, no network calls. Passwords are salted and
// hashed with SubtleCrypto (SHA-256) before ever touching storage — real hashing, not
// plaintext — but this is still browser-local storage, not a secure cloud auth service,
// and the UI says so rather than implying otherwise.
const ACCOUNTS_KEY = 'lumio.accounts';
const SESSION_KEY = 'lumio.session';

function loadAccounts(){
  try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveAccounts(accounts){
  try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); }
  catch(e){ console.warn('account save failed', e); }
}
function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
  catch(e){ return null; }
}
function setSession(accountId){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({accountId})); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function randomHex(len){
  try{
    const bytes = crypto.getRandomValues(new Uint8Array(len));
    return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let s=''; for(let i=0;i<len;i++) s+=Math.floor(Math.random()*256).toString(16).padStart(2,'0'); return s;
  }
}
async function hashPassword(password, salt){
  const text = salt+':'+password;
  try{
    if(window.crypto && window.crypto.subtle){
      const data = new TextEncoder().encode(text);
      const buf = await window.crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to the weaker fallback below */ }
  // Fallback for environments without SubtleCrypto (e.g. non-secure contexts). Not
  // cryptographically strong, but never stores the password itself.
  let h = 0;
  for(let i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; }
  return 'fb' + Math.abs(h).toString(16);
}
function findAccountByLogin(identifier){
  const accounts = loadAccounts();
  const id = (identifier||'').trim().toLowerCase();
  return accounts.find(a=>a.username.toLowerCase()===id || a.email.toLowerCase()===id) || null;
}
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

async function submitSignupLocal(){
  const name = document.getElementById('su-name').value.trim();
  const username = document.getElementById('su-username').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const confirm = document.getElementById('su-confirm').value;
  authError = '';
  if(!name || !username || !email || !password || !confirm){ authError='Please fill in every field.'; renderAuthScreen(); return; }
  if(!isValidEmail(email)){ authError='Enter a valid email address.'; renderAuthScreen(); return; }
  if(password.length<6){ authError='Password must be at least 6 characters.'; renderAuthScreen(); return; }
  if(password!==confirm){ authError='Passwords do not match.'; renderAuthScreen(); return; }
  const accounts = loadAccounts();
  if(accounts.some(a=>a.username.toLowerCase()===username.toLowerCase())){ authError='That username is already taken on this device.'; renderAuthScreen(); return; }
  if(accounts.some(a=>a.email.toLowerCase()===email.toLowerCase())){ authError='An account with that email already exists on this device.'; renderAuthScreen(); return; }

  const salt = randomHex(16);
  const passwordHash = await hashPassword(password, salt);
  const id = uid();
  const isFirstAccountEver = accounts.length===0;
  accounts.push({id, name, username, email, passwordHash, salt, createdAt: Date.now()});
  saveAccounts(accounts);
  setSession(id);
  currentAccountId = id;

  // Bring forward any pre-account-system data (from before this update) into the first account only.
  if(isFirstAccountEver){
    try{
      const legacyRaw = localStorage.getItem(STORAGE_KEY);
      if(legacyRaw && !localStorage.getItem(dataKeyFor(id))){
        localStorage.setItem(dataKeyFor(id), legacyRaw);
      }
    }catch(e){}
  }
  enterApp();
}

function ensureTodayTasks(){

/* ============================= DERIVED HELPERS ============================= */
function todaysTasks(){ const today=todayStr(); return S.tasks.filter(t=>t.date===today).sort((a,b)=>a.order-b.order); }
function activeTask(){ return S.tasks.find(t=>t.status==='ACTIVE'||t.status==='PAUSED'); }
function upNextTask(){ return todaysTasks().find(t=>t.status==='UP NEXT'); }
function currentMission(){ return activeTask() || upNextTask() || null; }

function computeXP(task){
  const base = Math.round((task.actualMinutes||task.plannedMinutes) * 0.8);
  const bonus = {High:20,Medium:10,Low:5}[task.priority]||10;
  return Math.max(10, base + bonus);
}
function addXP(amount){
  S.xp += amount;
  S.ui.todayXP = (S.ui.todayXP||0) + amount;
  let leveled = false;
  while(S.xp >= xpForLevel(S.level)){ S.xp -= xpForLevel(S.level); S.level++; leveled = true; }
  return leveled;
}
function bumpStreak(){
  const today = todayStr();
  if(S.streak.lastActiveDate === today) return;
  const yest = todayStr(new Date(Date.now()-86400000));
  if(S.streak.lastActiveDate === yest){ S.streak.current += 1; }
  else { S.streak.current = 1; }
  S.streak.longest = Math.max(S.streak.longest, S.streak.current);
  S.streak.lastActiveDate = today;
}
function logActivity(category, minutes){
  S.activityLog.push({date:todayStr(), category, minutes: Math.round(minutes)});
}
function unlockNext(afterTask){
  const list = S.tasks.filter(t=>t.date===afterTask.date).sort((a,b)=>a.order-b.order);
  const idx = list.findIndex(t=>t.id===afterTask.id);
  for(let i=idx+1;i<list.length;i++){
    if(list[i].status==='LOCKED'){ list[i].status='UP NEXT'; break; }
  }
}
// Guarantees a given date's queue always has exactly one actionable mission (ACTIVE/PAUSED/UP NEXT)
// if any LOCKED ones remain. Safe to call after any add/delete/move/complete/skip.
function ensureQueueIntegrity(date){
  const list = S.tasks.filter(t=>t.date===date).sort((a,b)=>a.order-b.order);
  const hasActionable = list.some(t=>t.status==='ACTIVE'||t.status==='UP NEXT'||t.status==='PAUSED');
  if(!hasActionable){
    const next = list.find(t=>t.status==='LOCKED');
    if(next) next.status='UP NEXT';
  }
}

/* ============================= TIMER LOGIC ============================= */
let tickHandle = null;
function timerElapsedMs(){
  if(!S.timer) return 0;
  const base = S.timer.accumulatedMs || 0;
  if(S.timer.status==='running'){ return base + (Date.now() - S.timer.startedAt); }
  return base;
}
function startMission(taskId){
  const task = S.tasks.find(t=>t.id===taskId);
  if(!task) return;
  const cur = activeTask();
  if(cur && cur.id!==task.id){ toast('Finish or pause the current mission first.'); return; }
  task.status='ACTIVE';
  S.timer = {taskId, status:'running', startedAt:Date.now(), accumulatedMs:0, plannedMs: task.plannedMinutes*60000, bannerDismissed:false, endSoundPlayed:false};
  saveState(); render();
  soundMissionStart();
}
function pauseMission(){
  if(!S.timer||S.timer.status!=='running') return;
  S.timer.accumulatedMs = timerElapsedMs();
  S.timer.status='paused';
  const t = S.tasks.find(x=>x.id===S.timer.taskId);
  if(t) t.status='PAUSED';
  saveState(); render();
}
function resumeMission(){
  if(!S.timer||S.timer.status!=='paused') return;
  S.timer.startedAt=Date.now();
  S.timer.status='running';
  const t = S.tasks.find(x=>x.id===S.timer.taskId);
  if(t) t.status='ACTIVE';
  saveState(); render();
}
function restartMission(){
  if(!S.timer) return;
  S.timer.accumulatedMs=0; S.timer.startedAt=Date.now(); S.timer.status='running'; S.timer.bannerDismissed=false; S.timer.endSoundPlayed=false;
  const t = S.tasks.find(x=>x.id===S.timer.taskId);
  if(t) t.status='ACTIVE';
  saveState(); render();
}
function keepWorking(){
  if(!S.timer) return;
  S.timer.bannerDismissed = true;
  saveState(); render();
}
function completeMission(taskId){
  const task = S.tasks.find(t=>t.id===taskId);
  if(!task) return;
  if(task.status==='COMPLETED') return; // guard against double-clicks / stale UI re-firing this
  const elapsedMin = S.timer && S.timer.taskId===taskId ? timerElapsedMs()/60000 : task.plannedMinutes;
  task.actualMinutes = Math.max(1, Math.round(elapsedMin));
  task.status='COMPLETED';
  const xp = computeXP(task);
  const leveled = addXP(xp);
  bumpStreak();
  logActivity(task.category, task.actualMinutes);
  unlockNext(task);
  ensureQueueIntegrity(task.date);
  if(S.timer && S.timer.taskId===taskId) S.timer=null;
  saveState();
  toast('Mission complete. Next mission unlocked.');
  soundComplete();
  if(leveled) setTimeout(soundLevelUp, 250);
  render();
}
function skipMission(taskId){
  const task = S.tasks.find(t=>t.id===taskId);
  if(!task) return;
  if(task.status==='SKIPPED'||task.status==='COMPLETED') return; // guard against double-firing
  task.status='SKIPPED';
  if(S.timer && S.timer.taskId===taskId) S.timer=null;
  unlockNext(task);
  ensureQueueIntegrity(task.date);
  saveState(); render();
}
function ensureTicking(){
  if(tickHandle) return;
  tickHandle = setInterval(()=>{
    if(S.timer && S.timer.status==='running'){
      renderTimerBits();
      if(Date.now()%5000 < 1000) saveState();
    }
  }, 1000);
}

/* ============================= SOUND (WebAudio, no external files) ============================= */
let audioCtx = null;
function playTone(freq, duration, type){
  if(!S.settings.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type||'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+duration+0.03);
  }catch(e){ /* audio unsupported/blocked — fail silently */ }
}
function soundMissionStart(){ playTone(520,0.14,'sine'); setTimeout(()=>playTone(660,0.16,'sine'),90); }
function soundComplete(){ playTone(660,0.12,'sine'); setTimeout(()=>playTone(880,0.18,'sine'),100); }
function soundTimerEnd(){ playTone(440,0.18,'triangle'); setTimeout(()=>playTone(440,0.18,'triangle'),220); }
function soundLevelUp(){ [520,660,780,880].forEach((f,i)=>setTimeout(()=>playTone(f,0.16,'sine'), i*110)); }

/* ============================= NOTIFICATIONS (optional, permission-gated, never spammy) ============================= */
function ensureNotificationPermission(){
  if(!('Notification' in window)) return;
  try{ if(Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
function notify(title, body){
  if(!S.settings.notifications) return;
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  try{ new Notification(title, {body, tag:title}); }catch(e){}
}
// Runs at most once per calendar day so exam/art deadlines never spam repeated alerts.
function checkDeadlineNotifications(){
  const today = todayStr();
  if(S.ui.lastDeadlineCheck===today) return;
  S.ui.lastDeadlineCheck = today;
  S.exams.forEach(ex=>{
    const du = daysUntil(ex.date);
    if(du!=null && du>=0 && du<=3) notify('Exam approaching', `${ex.name} is in ${du} day${du===1?'':'s'}.`);
  });
  S.art.projects.forEach(p=>{
    const du = daysUntil(p.deadline);
    if(du!=null && du>=0 && du<=7) notify('Art deadline approaching', `${p.name} is due in ${du} day${du===1?'':'s'}.`);
  });
  saveState();
}

  // stay in sync after any Start/Pause/Resume/Complete/Skip action taken while inside it.
  if(S.ui.view==='focus'){ showFocus(); } else { hideFocus(); }

  if(S.ui.setupScreen){ showSetupOverlay(); } else { hideSetupOverlay(); }
  attachGlobalHandlers();
}
function renderTimerBits(){
  // lightweight update: only refresh timer displays without full re-render, to keep it smooth
  const els = document.querySelectorAll('[data-timer-display]');
  if(!els.length){ return; }
  els.forEach(el=>{
    const taskId = el.getAttribute('data-timer-display');
    if(S.timer && S.timer.taskId===taskId){
      el.textContent = fmtClock(timerElapsedMs());
    }
  });
  const remEls = document.querySelectorAll('[data-timer-remain]');
  remEls.forEach(el=>{
    const taskId = el.getAttribute('data-timer-remain');
    if(S.timer && S.timer.taskId===taskId){
      const remain = S.timer.plannedMs - timerElapsedMs();
      el.textContent = remain>0 ? `${fmtMinutes(remain/60000)} remaining` : `+${fmtMinutes((-remain)/60000)} over plan`;
    }
  });
  // planned-finished banner check
  if(S.timer && S.timer.status==='running' && !S.timer.bannerDismissed && timerElapsedMs() >= S.timer.plannedMs){
    const b = document.getElementById('plannedFinishedBanner');
    if(b) b.style.display='flex';
    if(!S.timer.endSoundPlayed){
      S.timer.endSoundPlayed = true;
      soundTimerEnd();
      const task = S.tasks.find(x=>x.id===S.timer.taskId);
      notify('Planned time finished', task ? `"${task.name}" has reached its planned duration.` : 'A mission has reached its planned duration.');
    }
  }
}

function pageDashboard(){
  const list = todaysTasks();
  const planned = list.reduce((s,t)=>s+t.plannedMinutes,0);
  const doneMinutes = list.filter(t=>t.status==='COMPLETED').reduce((s,t)=>s+t.actualMinutes,0);
  const pct = planned>0 ? clamp(Math.round(100*doneMinutes/planned),0,100) : 0;
  const mission = currentMission();
  const completedCount = list.filter(t=>t.status==='COMPLETED').length;
  const remainingCount = list.filter(t=>!['COMPLETED','SKIPPED'].includes(t.status)).length;

  const catStats = {};
  list.forEach(t=>{
    catStats[t.category] = catStats[t.category] || {planned:0, actual:0};
    catStats[t.category].planned += t.plannedMinutes;
    if(t.status==='COMPLETED') catStats[t.category].actual += t.actualMinutes;
  });

  const deadlines = [
    ...S.exams.map(e=>({name:e.name, date:e.date, kind:'Exam'})),
    ...S.art.projects.map(p=>({name:p.name, date:p.deadline, kind:'Art'})),
  ].filter(d=>d.date).sort((a,b)=>daysUntil(a.date)-daysUntil(b.date)).slice(0,4);

  return `
  <div class="dash-grid">
    <div>
      ${mission ? renderMissionCard(mission) : renderNoMission()}

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div class="section-title" style="margin:0;">Today's progress</div>
          <div style="font-family:Sora;font-weight:700;">${pct}%</div>
        </div>
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div style="display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;">
          <div class="stat-label">${completedCount} completed</div>
          <div class="stat-label">${remainingCount} remaining</div>
          <div class="stat-label">${fmtMinutes(doneMinutes)} of ${fmtMinutes(planned)}</div>
        </div>
        <hr class="sep">
        ${Object.keys(catStats).length ? Object.entries(catStats).map(([cat,v])=>{
          const p = v.planned>0?clamp(Math.round(100*v.actual/v.planned),0,100):0;
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;">

            </div>

          </div>`;
        }).join('') : `<div class="empty">No missions scheduled for today yet. <br>Add one to get moving.</div>`}
      </div>
    </div>
    <div>
      <div class="card">
        <div class="section-title">Quick stats</div>
        <div class="grid grid-2" style="gap:12px;">

          <div><div class="stat-num">${S.streak.current}</div><div class="stat-label">Streak</div></div>
          <div><div class="stat-num">${S.streak.longest}</div><div class="stat-label">Best streak</div></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Upcoming deadlines</div>
        ${deadlines.length? deadlines.map(d=>{
          const du = daysUntil(d.date);

  const paused = isTimerTask && S.timer.status==='paused';

  const overPlanned = isTimerTask && elapsed >= plannedMs && !S.timer.bannerDismissed;
  return `
  <div class="mission-card">
    <div class="mission-cat">${esc((CATS[task.category]||{label:task.category}).label).toUpperCase()}${task.subject?' · '+esc(task.subject):''}</div>

    <div class="mission-sub">${task.plannedMinutes} min planned · Priority ${task.priority}</div>
    ${isTimerTask ? `

      <div class="timer-meta" data-timer-remain="${task.id}">${plannedMs-elapsed>0?fmtMinutes((plannedMs-elapsed)/60000)+' remaining':'+'+fmtMinutes((elapsed-plannedMs)/60000)+' over plan'}</div>

      </div>

  return `<div class="task-row ${t.status==='ACTIVE'?'is-active':''} ${locked?'is-locked':''}">
    <div class="dot" style="background:${(CATS[t.category]||{color:'#888'}).color}"></div>

        <span>${t.plannedMinutes}m planned</span>
        ${done?`<span>${t.actualMinutes}m actual · +${computeXP(t)}xp</span>`:''}
        ${isTimerTask?`<span data-timer-display="${t.id}">${fmtClock(timerElapsedMs())}</span>`:''}
        <span>Priority ${t.priority}</span>
        ${t.sample?`<span class="badge" style="background:rgba(157,140,255,.15);color:var(--accent-2);">Sample</span>`:''}

      ${t.status==='ACTIVE' ? `<button class="btn btn-sm" onclick="App.pauseMission()">${icon('pause')} Pause</button>` : ''}
      ${t.status==='PAUSED' ? `<button class="btn btn-sm btn-primary" onclick="App.resumeMission()">${icon('play')} Resume</button>` : ''}
      ${(t.status==='ACTIVE'||t.status==='PAUSED') ? `<button class="btn btn-sm btn-success" onclick="App.completeMission('${t.id}')">${icon('check')} Complete</button>` : ''}
      ${!done && !skipped && !locked ? `<button class="icon-btn" title="Skip" aria-label="Skip mission" onclick="App.skipMission('${t.id}')">${icon('skip')}</button>`:''}

function renderCalDay(date){
  const list = S.tasks.filter(t=>t.date===date).sort((a,b)=>a.order-b.order);
  const deadlines = [
    ...S.exams.filter(e=>e.date===date).map(e=>e.name+' (Exam)'),
    ...S.art.projects.filter(p=>p.deadline===date).map(p=>p.name+' (Art deadline)'),

  const isToday = date===todayStr();
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;">
      <button class="icon-btn" onclick="App.setCalDate('${addDays(date,-1)}')" aria-label="Previous day">${icon('chevL')}</button>
      <div style="font-weight:700;text-align:center;">${new Date(date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}${isToday?' · Today':''}</div>
      <button class="icon-btn" onclick="App.setCalDate('${addDays(date,1)}')" aria-label="Next day">${icon('chevR')}</button>
    </div>
    ${deadlines.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${deadlines.map(d=>`<span class="badge badge-skipped">${esc(d)} due</span>`).join('')}</div>`:''}

  </div>`;
}
function renderCalWeek(date){
  const start = startOfWeek(date);

// opts: {silent, healthDefaults} — used by onboarding to seed the very first plan from profile answers.
// healthDefaults, when given, controls which health categories are candidates (null = user disabled it) and their minutes.
function autoPlanDay(date, opts){
  opts = opts || {};
  const weekend = isWeekend(date);
  const budget = weekend ? S.settings.weekendAvailable : S.settings.dailyAvailable;
  const existing = S.tasks.filter(t=>t.date===date);
  const usedMinutes = existing.reduce((s,t)=>s+t.plannedMinutes,0);
  let remaining = Math.max(0, budget - usedMinutes);
  if(remaining<=0){ if(!opts.silent){ toast('No available time left on this day — free up time in Settings or pick another day.'); closeModal(); } return; }

  const priWeight = {High:3,Medium:2,Low:1};
  const weakSubjects = (S.profile && S.profile.weakSubjects) || [];
  const candidates = [];
  S.exams.forEach(ex=>{
    const urgency = daysUntil(ex.date);
    const soon = urgency!=null && urgency<=7;
    const isWeak = weakSubjects.some(s=>ex.subject && ex.subject.toLowerCase().includes(s.toLowerCase()));
    ex.chapters.filter(c=>c.status!=='Mastered').forEach(c=>{
      candidates.push({name:`${ex.name} — ${c.name}`, category:'Exam', subject:ex.subject, plannedMinutes:40,
        priority: soon?'High':ex.priority, weight:(priWeight[ex.priority]||2)+(soon?2:0)+(isWeak?1.5:0)});
    });
  });
  ['Physics','Chemistry','Mathematics'].forEach(sub=>{
    const isWeakSubject = weakSubjects.some(s=>sub.toLowerCase().includes(s.toLowerCase())||s.toLowerCase().includes(sub.toLowerCase()));
    (S.jee[sub]||[]).forEach(t=>{
      candidates.push({name:`${t.name} — practice`, category:'JEE', subject:sub, plannedMinutes:45,
        priority: t.weak?'High':'Medium', weight:(t.weak?3:1.5)+(t.revision==='Not Started'?1:0)+(isWeakSubject?1:0)});
    });
  });
  S.art.projects.forEach(p=>{
    if(p.weekendOnly && !weekend) return;
    if(existing.some(t=>t.category==='Art')) return;
    const nextTask = p.tasks.find(t=>!t.done);
    if(nextTask){
      const urgency = daysUntil(p.deadline);
      candidates.push({name:`${p.name} — ${nextTask.name}`, category:'Art', plannedMinutes:Math.min(90,nextTask.hours*60),
        priority:'High', weight:3+(urgency!=null&&urgency<=14?2:0), weekendOnly:p.weekendOnly});
    }
  });
  const hd = opts.healthDefaults;
  const wantExercise = hd ? !!hd.exercise : true;
  const wantMeditation = hd ? !!hd.meditation : true;
  const wantReading = hd ? !!hd.reading : true;
  if(wantExercise && !existing.some(t=>t.category==='Exercise')) candidates.push({name:'Exercise session', category:'Exercise', plannedMinutes:(hd&&hd.exercise&&hd.exercise.minutes)||30, priority:'Medium', weight:1.5});
  if(wantMeditation && !existing.some(t=>t.category==='Meditation')) candidates.push({name:'Meditation', category:'Meditation', plannedMinutes:(hd&&hd.meditation&&hd.meditation.minutes)||15, priority:'Low', weight:1.2});
  if(wantReading && !existing.some(t=>t.category==='Reading')) candidates.push({name:'Reading session', category:'Reading', plannedMinutes:(hd&&hd.reading&&hd.reading.minutes)||20, priority:'Low', weight:1});
  S.projects.forEach(p=>{
    const nextTask = p.tasks.find(t=>!t.done);
    if(nextTask) candidates.push({name:`${p.name} — ${nextTask.name}`, category:'Projects', plannedMinutes:30, priority:p.priority, weight:0.8});
  });

  candidates.sort((a,b)=>b.weight-a.weight);
  const chosen=[];
  for(const c of candidates){
    if(c.plannedMinutes<=remaining){ chosen.push(c); remaining-=c.plannedMinutes; }
  }
  if(!chosen.length){ if(!opts.silent){ toast('Not enough available time left to add anything new.'); closeModal(); } return; }
  let ord = S.tasks.filter(t=>t.date===date).length;
  chosen.forEach(c=>{
    S.tasks.push({id:uid(), name:c.name, category:c.category, subject:c.subject, plannedMinutes:c.plannedMinutes, priority:c.priority, status:'LOCKED', actualMinutes:0, date, order:ord++, weekendOnly:c.weekendOnly||false});
  });
  ensureQueueIntegrity(date);
  if(!opts.silent){
    saveState(); closeModal(); render();
    toast(`Planned ${chosen.length} mission${chosen.length>1?'s':''} for ${fmtDate(date)}. Edit or delete any of them any time.`);
  }
}

/* ============================= EXAMS ============================= */
function chapterPct(chapters){
  const weights = {'Not Started':0,'Learning':0.35,'Practicing':0.6,'Revising':0.85,'Mastered':1};
  if(!chapters.length) return 0;
  return Math.round(100*chapters.reduce((s,c)=>s+(weights[c.status]||0),0)/chapters.length);
}

  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">

/* ============================= ANALYTICS ============================= */
function pageAnalytics(){
  const log = S.activityLog;
  const days = [...Array(7)].map((_,i)=>todayStr(new Date(Date.now()-(6-i)*86400000)));
  const dayTotals = days.map(d=>log.filter(l=>l.date===d).reduce((s,l)=>s+l.minutes,0));
  const maxDay = Math.max(1,...dayTotals);
  const byCat = {};
  log.forEach(l=>{ byCat[l.category]=(byCat[l.category]||0)+l.minutes; });
  const totalCat = Object.values(byCat).reduce((a,b)=>a+b,0)||1;

  const completed = S.tasks.filter(t=>t.status==='COMPLETED');
  const skipped = S.tasks.filter(t=>t.status==='SKIPPED');
  const totalDone = completed.length+skipped.length;
  const completionRate = totalDone? Math.round(100*completed.length/totalDone):0;
  const avgPlanned = completed.length? Math.round(completed.reduce((s,t)=>s+t.plannedMinutes,0)/completed.length):0;
  const avgActual = completed.length? Math.round(completed.reduce((s,t)=>s+t.actualMinutes,0)/completed.length):0;

  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const prodByDow = [0,0,0,0,0,0,0];
  log.forEach(l=>{ const dow=new Date(l.date+'T00:00:00').getDay(); prodByDow[dow]+=l.minutes; });
  const bestDowIdx = prodByDow.indexOf(Math.max(...prodByDow));
  const bestDow = Math.max(...prodByDow)>0 ? dayNames[bestDowIdx] : '—';

  const skipCounts={};
  skipped.forEach(t=>{ skipCounts[t.category]=(skipCounts[t.category]||0)+1; });
  const mostSkipped = Object.keys(skipCounts).length ? Object.entries(skipCounts).sort((a,b)=>b[1]-a[1])[0][0] : '—';

  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="section-title">Study time — last 7 days</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:130px;">
        ${dayTotals.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:100%;background:var(--panel-b);border-radius:6px;height:${Math.round(90*v/maxDay)}px;background:linear-gradient(180deg,var(--accent-2),var(--accent));min-height:2px;"></div>
          <div style="font-size:10.5px;color:var(--text-faint);">${new Date(days[i]+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'})[0]}</div>
        </div>`).join('')}
      </div>
      <div class="stat-label" style="margin-top:8px;">Total ${fmtMinutes(dayTotals.reduce((a,b)=>a+b,0))} this week</div>
    </div>
    <div class="card">
      <div class="section-title">Completion rate</div>
      <div style="display:flex;align-items:center;gap:20px;">
        <div style="width:96px;height:96px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--success) ${completionRate*3.6}deg, var(--panel-b) 0);display:flex;align-items:center;justify-content:center;">
          <div style="width:68px;height:68px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:Sora;font-weight:700;">${completionRate}%</div>
        </div>
        <div style="font-size:12.5px;color:var(--text-dim);">${completed.length} completed<br>${skipped.length} skipped<br>of ${totalDone} decided missions</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Planned vs actual (avg per mission)</div>
      <div style="display:flex;gap:22px;align-items:flex-end;height:110px;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:60%;border-radius:6px 6px 0 0;height:${avgPlanned?clamp(avgPlanned,4,90):2}px;background:var(--panel-b);border:1px solid var(--border);"></div>
          <div class="stat-label">Planned ${avgPlanned}m</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="width:60%;border-radius:6px 6px 0 0;height:${avgActual?clamp(avgActual,4,90):2}px;background:linear-gradient(180deg,var(--accent-2),var(--accent));"></div>
          <div class="stat-label">Actual ${avgActual}m</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Subject distribution</div>
      ${Object.keys(byCat).length ? Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,m])=>{
        const p = Math.round(100*m/totalCat);
        return `<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${esc((CATS[c]||{label:c}).label)}</span><span>${p}%</span></div><div class="progress thin"><div style="width:${p}%;background:${(CATS[c]||{color:'var(--accent)'}).color}"></div></div></div>`;
      }).join('') : `<div class="empty">Complete missions to see distribution.</div>`}
    </div>
    <div class="card">
      <div class="section-title">Weekly consistency</div>
      <div class="heatrow">${dayTotals.map(v=>`<div class="heat-cell" style="background:${v===0?'var(--panel-2)':`rgba(124,106,240,${clamp(v/maxDay,.18,1)})`}"></div>`).join('')}</div>
      <div class="stat-label" style="margin-top:8px;">Most productive day: <b style="color:var(--text);">${bestDow}</b></div>
      <div class="stat-label">Most skipped category: <b style="color:var(--text);">${esc((CATS[mostSkipped]||{label:mostSkipped}).label)}</b></div>
    </div>
    <div class="card">
      <div class="section-title">JEE & Art progress</div>
      ${['Physics','Chemistry','Mathematics'].map(s=>{
        const arr=S.jee[s]; const avg = arr.length? Math.round(arr.reduce((a,t)=>a+t.progress,0)/arr.length):0;
        return `<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${s}</span><span>${avg}%</span></div><div class="progress thin"><div style="width:${avg}%"></div></div></div>`;
      }).join('')}
      ${S.art.projects.map(p=>{
        const doneHours = p.tasks.filter(t=>t.done).reduce((s,t)=>s+(t.hours||0),0)+p.completedHours;
        const pct = p.estimatedHours>0?clamp(Math.round(100*doneHours/p.estimatedHours),0,100):0;
        return `<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${esc(p.name)}</span><span>${pct}%</span></div><div class="progress thin"><div style="width:${pct}%;background:#E8A94B;"></div></div></div>`;
      }).join('')}
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div class="section-title" style="margin:0;">Mistake Book</div>
      <button class="btn btn-ghost btn-sm" onclick="App.go('mistakes')">Open Mistake Book</button>
    </div>
    ${S.mistakes.length? `<div style="display:flex;gap:18px;flex-wrap:wrap;">
      <div class="stat-label">${S.mistakes.filter(m=>m.status==='TO REVIEW').length} to review</div>
      <div class="stat-label">${S.mistakes.filter(m=>m.status==='REVIEWED').length} reviewed</div>
      <div class="stat-label">${S.mistakes.filter(m=>m.status==='MASTERED').length} mastered</div>
    </div>` : `<div class="empty">No mistakes logged yet.</div>`}
  </div>`;
}

function submitMistake(){
  const topic = document.getElementById('m-topic').value.trim();
  if(!topic){ toast('Name the topic.'); return; }
  S.mistakes.push({id:uid(), subject:document.getElementById('m-subject').value.trim(), topic,
    question:document.getElementById('m-question').value.trim(), whatWrong:document.getElementById('m-wrong').value.trim(),
    correctConcept:document.getElementById('m-concept').value.trim(), correctMethod:document.getElementById('m-method').value.trim(),

/* ============================= FOCUS MODE ============================= */
function renderFocusOverlay(){
  const mission = currentMission();
  const isTimerTask = mission && S.timer && S.timer.taskId===mission.id;
  const running = isTimerTask && S.timer.status==='running';
  const paused = isTimerTask && S.timer.status==='paused';
  const elapsed = isTimerTask ? timerElapsedMs() : 0;
  const plannedMs = mission ? mission.plannedMinutes*60000 : 0;
  const remainText = isTimerTask ? (plannedMs-elapsed>0?fmtMinutes((plannedMs-elapsed)/60000)+' remaining':'+'+fmtMinutes((elapsed-plannedMs)/60000)+' over plan') : (mission?mission.plannedMinutes+' min planned':'');
  const overPlanned = isTimerTask && S.timer.status==='running' && !S.timer.bannerDismissed && elapsed >= plannedMs;
  return `<div class="focus-overlay">
    <button class="btn btn-ghost btn-icon focus-exit" onclick="App.exitFocus()" aria-label="Exit focus mode">${icon('close')}</button>
    ${mission ? `
      <div class="mission-cat">${esc((CATS[mission.category]||{label:mission.category}).label).toUpperCase()}</div>
      <div class="mission-title" style="font-size:clamp(20px,4vw,30px);">${esc(mission.name)}</div>
      <div class="focus-timer ${running?'pulse':''}" data-timer-display="${mission.id}">${isTimerTask?fmtClock(elapsed):fmtClock(0)}</div>
      <div class="timer-meta" data-timer-remain="${mission.id}">${remainText}</div>
      ${isTimerTask ? `<div id="plannedFinishedBanner" class="card" style="background:rgba(232,169,75,.1);border-color:rgba(232,169,75,.35); display:${overPlanned?'flex':'none'}; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; max-width:420px;">
        <div style="font-size:13px;color:var(--warning);font-weight:600;">Planned time finished.</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-ghost" onclick="App.keepWorking()">Keep working</button>
          <button class="btn btn-sm btn-success" onclick="App.completeMission('${mission.id}')">${icon('check')} Complete mission</button>
        </div>
      </div>` : ''}
      <div class="mission-actions" style="justify-content:center;">
        ${!isTimerTask?`<button class="btn btn-primary" onclick="App.startMission('${mission.id}')">${icon('play')} Start mission</button>`:''}
        ${running ? `<button class="btn" onclick="App.pauseMission()">${icon('pause')} Pause</button>`:''}
        ${paused ? `<button class="btn btn-primary" onclick="App.resumeMission()">${icon('play')} Resume</button>`:''}
        ${isTimerTask?`<button class="btn btn-ghost" onclick="App.restartMission()">${icon('restart')} Restart</button>`:''}
        ${isTimerTask?`<button class="btn btn-success" onclick="App.completeMission('${mission.id}')">${icon('check')} Complete</button>`:''}
        <button class="btn btn-ghost" onclick="App.openIdeaModal()">${icon('bulb')} Capture idea</button>
      </div>
    ` : `<div class="empty"><b>No active mission</b>Exit focus mode and start one from the dashboard.</div>`}
  </div>`;
}

function wizardNext(){

function wizardBack(){

  if(ob.step<=1){

    if(ob.mode==='edit'){ S.ui.setupScreen=null; }
    else { S.ui.setupScreen = S.profile.setupDismissed ? null : 'choice'; }
    S.ui.onboard = null;
    saveState(); render();

function wizardToggleMulti(key,value){
  const arr = S.ui.onboard.data[key];
  const i = arr.indexOf(value);
  if(i>=0){
    arr.splice(i,1);
    if(key==='subjects'){
      // Keep strong/weak lists consistent with the chosen subject list.
      ['strongSubjects','weakSubjects'].forEach(k=>{

        const j = other.indexOf(value);

// The core "profile actually drives the plan" step: builds real profile/settings/exams/JEE/art/health/projects
// from onboarding answers, purges leftover sample data (setup mode only), and generates today's real plan.
function finishOnboarding(){
  const d = S.ui.onboard.data;
  const isEdit = S.ui.onboard.mode==='edit';
  S.profile = Object.assign({}, S.profile, {
    onboarded:true, setupDismissed:true,
    name:d.name.trim(), avatarColor:d.avatarColor, age:d.age, grade:d.grade, school:d.school, country:d.country, timezone:d.timezone,
    educationSystem:d.educationSystem, subjects:d.subjects.slice(), strongSubjects:d.strongSubjects.slice(), weakSubjects:d.weakSubjects.slice(),
    academicPriority:d.academicPriority, majorGoal:d.majorGoal, longTermGoal:d.longTermGoal, dailyPriority:d.dailyPriority,
  });
  S.settings.dailyAvailable = d.weekdayMinutes;
  S.settings.weekendAvailable = d.weekendMinutes;
  S.settings.defaultFocus = d.focusDuration;
  S.settings.defaultBreak = d.breakDuration;
  S.settings.sound = d.sound;
  S.settings.notifications = d.notifications;

  if(!isEdit){
    // First real setup — clear sample placeholders so they don't sit alongside the real plan.
    S.tasks = S.tasks.filter(t=>!t.sample);
    S.exams = S.exams.filter(e=>!e.sample);
    ['Physics','Chemistry','Mathematics'].forEach(sub=>{ S.jee[sub] = S.jee[sub].filter(t=>!t.sample); });
    S.art.projects = S.art.projects.filter(p=>!p.sample);
    S.projects = S.projects.filter(p=>!p.sample);
    S.health.exercise = S.health.exercise.filter(e=>!e.sample);
    if(S.health.reading.sample) S.health.reading = {book:'', totalPages:0, currentPage:0, sessions:[]};
    S.mistakes = S.mistakes.filter(m=>!m.sample);
    S.flashcards = S.flashcards.filter(f=>!f.sample);
    S.quizzes = S.quizzes.filter(q=>!q.sample);
  }

  d.exams.forEach(ex=>{
    if(!ex.name.trim()) return;
    S.exams.push({id:uid(), name:ex.name.trim(), subject:ex.subject.trim()||'General', date:ex.date||todayStr(new Date(Date.now()+14*86400000)), priority:ex.priority,
      chapters:(ex.chapters||'').split(',').map(c=>c.trim()).filter(Boolean).map(name=>({id:uid(),name,status:'Not Started'}))});
  });

  if(d.jeeEnabled){
    const topicName = d.jeeTopic.trim() || 'Foundations';
    ['Physics','Chemistry','Mathematics'].forEach(sub=>{
      const enabledKey = {Physics:'jeePhysics',Chemistry:'jeeChemistry',Mathematics:'jeeMathematics'}[sub];
      if(d[enabledKey]){
        S.jee[sub].push({id:uid(), name:topicName, progress:clamp(d.jeeProgress,0,100), practiceTotal:50, practiceDone:Math.round(clamp(d.jeeProgress,0,100)/2), revision: d.jeeProgress>=80?'Revising':d.jeeProgress>=40?'Practicing':'Learning', weak:false, strong:false});
      }
    });
  }

  if(d.artEnabled && d.artName.trim()){
    S.art.projects.push({id:uid(), name:d.artName.trim(), deadline:d.artDeadline||todayStr(new Date(Date.now()+30*86400000)), weekendOnly:d.artWeekendOnly, estimatedHours:d.artHours, completedHours:0,
      tasks:[{id:uid(), name:'Initial sketches', done:false, hours:Math.max(1,Math.round(d.artHours*0.15))},
             {id:uid(), name:'Main work', done:false, hours:Math.max(1,Math.round(d.artHours*0.6))},
             {id:uid(), name:'Final touches & submission', done:false, hours:Math.max(1,Math.round(d.artHours*0.25))}]});
  }

  if(d.readingEnabled && d.readingBook.trim()){
    S.health.reading = {book:d.readingBook.trim(), totalPages:d.readingPages||200, currentPage:0, sessions:[]};
  }

  d.projects.forEach(p=>{
    if(!p.name.trim()) return;
    S.projects.push({id:uid(), name:p.name.trim(), description:p.description.trim(), priority:'Medium', deadline:'', tasks:[], progress:0});
  });

  S.ui.onboard = null;
  S.ui.setupScreen = null;

  if(!isEdit){
    autoPlanDay(todayStr(), {silent:true, healthDefaults:{
      exercise: d.exerciseEnabled ? {minutes:d.exerciseMinutes} : null,
      meditation: d.meditationEnabled ? {minutes:d.meditationMinutes} : null,
      reading: d.readingEnabled ? {minutes:20} : null,
    }});
  }
  saveState(); render();
  toast(isEdit ? 'Profile updated.' : `Welcome, ${S.profile.name.split(' ')[0]}. Your first mission plan is ready.`);
}

function deleteTask(id){
  if(S.timer && S.timer.taskId===id) return toast('Finish or skip the active mission first.');
  const task = S.tasks.find(t=>t.id===id);
  const date = task ? task.date : null;
  S.tasks = S.tasks.filter(t=>t.id!==id);
  if(date) ensureQueueIntegrity(date);
  saveState(); render();
}
// Moves a mission to a different date. Blocked while it's the one currently being timed
// (pause or complete it first), since a running timer only makes sense against today's queue.
function moveTaskDate(taskId, newDate){
  const task = S.tasks.find(t=>t.id===taskId);
  if(!task || !newDate) return;
  if(task.status==='ACTIVE'||task.status==='PAUSED'){ toast('Pause or complete this mission before moving it.'); render(); return; }
  const oldDate = task.date;
  if(oldDate===newDate) return;
  task.date = newDate;
  task.status = 'LOCKED';
  task.order = S.tasks.filter(t=>t.date===newDate && t.id!==taskId).length;
  ensureQueueIntegrity(oldDate);
  ensureQueueIntegrity(newDate);
  saveState(); render();
  toast(`Mission moved to ${fmtDate(newDate)}.`);
}

/* ============================= INSTALL PROMPT ============================= */
// Captures the real browser install prompt where the platform actually offers one
// (mainly Chromium-based browsers with a valid manifest). Nothing is faked: if the
// event never fires, the button below falls back to honest manual instructions.
let deferredInstallPrompt = null;
try{
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });
}catch(e){}
async function installLumio(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt = null;
    return;
  }
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS/.test(ua);
  let msg;
  if(isIOS && isSafari){
    msg = `Tap the Share icon in Safari, then "Add to Home Screen" to install ${APP_NAME}.`;
  } else if(/Android/.test(ua)){
    msg = `Open your browser menu (\u22ee) and choose "Install app" or "Add to Home screen" to install ${APP_NAME}.`;
  } else {
    msg = `Look for an install icon in your browser's address bar, or open the browser menu and choose "Install ${APP_NAME}" / "Add to Home screen". This option isn't offered by every browser.`;
  }
  openModal(`<h3>Install ${APP_NAME}</h3><p style="font-size:13.5px;color:var(--text-dim);">${esc(msg)}</p><div class="modal-foot"><button class="btn btn-primary" style="width:100%;" onclick="App.closeModal()">Got it</button></div>`);
}

/* ============================= PWA (best-effort) ============================= */
// Provides a web app manifest so mobile browsers offer "Add to Home Screen".
// A full native install prompt additionally requires a service worker served from a
// stable same-origin URL, which a single self-contained HTML file can't register —
// see the QA notes for what that would take.
function setupPwaManifest(){
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.warn('SW registration failed',e));
  }
}

    <label class="field">Email <input type="email" id="su-email" autocomplete="email"></label><label class="field">Password <input type="password" id="su-password" autocomplete="new-password"></label>
    <label class="field">Confirm password <input type="password" id="su-confirm" autocomplete="new-password"></label></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="App.setAuthView('gate')">Back</button><button class="btn btn-primary" onclick="App.submitSignup()">Create account</button></div>`);
  if(authView==='login') return shell(`<div class="onboard-step-label">Welcome back</div><div class="onboard-title">Log in to ${APP_NAME}</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px;"><label class="field">Email <input type="email" id="li-email" autocomplete="email"></label>
    <label class="field">Password <input type="password" id="li-password" autocomplete="current-password"></label></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="App.setAuthView('forgot')">Forgot password?</button>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="App.setAuthView('gate')">Back</button><button class="btn btn-primary" onclick="App.submitLogin()">Log in</button></div>`);
  shell(`<div class="onboard-title">${APP_NAME}</div><p style="color:var(--text-dim);font-size:13.5px;">${APP_TAGLINE}</p><div class="modal-foot"><button class="btn btn-primary" onclick="App.setAuthView('login')">Log in</button><button class="btn btn-ghost" onclick="App.setAuthView('signup')">Sign up</button></div>`);
}
async function submitSignup(){
  if(!CLOUD) return submitSignupLocal();
  const v=id=>document.getElementById(id).value.trim(); const name=v('su-name'),username=v('su-username'),email=v('su-email').toLowerCase(),pw=document.getElementById('su-password').value,cf=document.getElementById('su-confirm').value;
  if(!name||!username||!email||!pw) return setAuthMsg('Please fill in every field.');
  if(!isValidEmail(email)) return setAuthMsg('Enter a valid email address.');
  if(pw.length<8) return setAuthMsg('Password must be at least 8 characters.');
  if(pw!==cf) return setAuthMsg('Passwords do not match.');
  try{
    const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name,username}}});
    if(error) return setAuthMsg(authNet(error));
    if(data.session){ await sb.auth.signOut(); return setAuthMsg('Email confirmation is turned off in your Supabase project, so this email was not verified. Enable "Confirm email" and try again.'); }
    if(data.user && data.user.identities && !data.user.identities.length) return setAuthMsg('An account with this email already exists. Try logging in.');
    pendingEmail=email; resendAt=Date.now()+60000; authView='verify'; authError=''; renderAuthScreen();
  }catch(e){ setAuthMsg(authNet(e)); }
}
async function cloudVerify(){
  const token=document.getElementById('otp').value.trim(); if(!token) return setAuthMsg('Enter the code from your email.');
  try{ const {data,error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:'signup'});
    if(error) return setAuthMsg(/expired/i.test(error.message)?'That code has expired. Tap Resend code.':/invalid/i.test(error.message)?'That code is incorrect.':authNet(error));
    await startCloudSession(data.user);
  }catch(e){ setAuthMsg(authNet(e)); }
}
async function cloudResend(){
  const wait=Math.ceil((resendAt-Date.now())/1000); if(wait>0) return setAuthMsg(`Please wait ${wait}s before requesting another code.`);
  try{ const {error}=await sb.auth.resend({type:'signup',email:pendingEmail}); if(error) return setAuthMsg(authNet(error)); resendAt=Date.now()+60000; authError=''; toast('A new code was sent.'); }catch(e){ setAuthMsg(authNet(e)); }
}
async function submitLogin(){
  if(!CLOUD) return submitLoginLocal();
  const email=document.getElementById('li-email').value.trim().toLowerCase(),pw=document.getElementById('li-password').value;
  if(!email||!pw) return setAuthMsg('Enter your email and password.');
  try{ const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){ if(/not confirmed/i.test(error.message)){ pendingEmail=email; await sb.auth.resend({type:'signup',email}).catch(()=>{}); resendAt=Date.now()+60000; authView='verify'; authError=''; return renderAuthScreen(); } return setAuthMsg(/invalid/i.test(error.message)?'Incorrect email or password.':authNet(error)); }
    await startCloudSession(data.user);
  }catch(e){ setAuthMsg(authNet(e)); }
}
async function cloudForgot(){
  const email=document.getElementById('fp-email').value.trim().toLowerCase(); if(!isValidEmail(email)) return setAuthMsg('Enter a valid email address.');
  try{ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) return setAuthMsg(authNet(error)); authView='login'; authError=''; renderAuthScreen(); toast('If that email has an account, a reset link was sent.'); }catch(e){ setAuthMsg(authNet(e)); }
}
async function cloudSetPassword(){
  const pw=document.getElementById('np').value; if(pw.length<8) return setAuthMsg('Password must be at least 8 characters.');
  try{ const {data,error}=await sb.auth.updateUser({password:pw}); if(error) return setAuthMsg(authNet(error)); await startCloudSession(data.user); toast('Password updated.'); }catch(e){ setAuthMsg(authNet(e)); }
}
async function startCloudSession(user){
  if(cloudBusy) return; cloudBusy=true;
  try{
    const md=user.user_metadata||{}; const accs=loadAccounts().filter(a=>a.id!==user.id);
    accs.push({id:user.id,name:md.name||'Learner',username:md.username||(user.email||'').split('@')[0],email:user.email,passwordHash:'',salt:'',createdAt:Date.now()}); saveAccounts(accs);
    setSession(user.id); currentAccountId=user.id;
    try{ const {data:row}=await sb.from('lumio_user_data').select('data').eq('user_id',user.id).maybeSingle(); if(row&&row.data) localStorage.setItem(dataKeyFor(user.id),JSON.stringify(row.data)); }
    catch(e){ toast('Could not load cloud data; using data on this device.'); }
    enterApp(); pushCloud();
  } finally{ cloudBusy=false; }
}
function bootApp(){
  if(!CLOUD) return bootAppLocal();
  document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:var(--text-dim);">Loading LUMIO…</div>';
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){ authView='reset'; authError=''; renderAuthScreen(); } });
  sb.auth.getSession().then(async({data})=>{ if(data.session && authView!=='reset') await startCloudSession(data.session.user); else if(!data.session){ clearSession(); authView='gate'; renderAuthScreen(); } })
   .catch(()=>{ authError='Could not reach the sign-in service.'; authView='gate'; renderAuthScreen(); });
}
async function doLogout(){ if(CLOUD){ try{ clearTimeout(pushTimer); await pushCloud(); await sb.auth.signOut(); }catch(e){} } closeModal(); doLogoutLocal(); }

/* ============================= INIT ============================= */
bootApp();

})();
</script>
